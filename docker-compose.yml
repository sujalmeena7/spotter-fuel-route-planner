services:
  web:
    build: .
    container_name: spotter_fuel_planner
    ports:
      - "8000:8000"
    environment:
      - DEBUG=0
      - SECRET_KEY=${SECRET_KEY:-django-insecure-spotter-production-demo-key-2026}
      - ALLOWED_HOSTS=*
      - REDIS_URL=redis://redis:6379/1
      - ORS_API_KEY=${ORS_API_KEY:-}
      - TANK_GALLONS=50
      - MPG=10
      - CORRIDOR_MILES=10
      - ORIGIN_RADIUS_MILES=25
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: spotter_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
